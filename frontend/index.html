<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SealNet · Campus Recruitment Automation Infrastructure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- React 18 & Babel for instant double-click execution in any browser -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, createContext, useContext } = React;

    // API Service for Standalone Browser
    const API_BASE = 'http://localhost:5000/api/auth';
    const authService = {
      login: async (email, password) => {
        try {
          const res = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Authentication failed');
          if (data.user && data.user.role === 'student') {
            localStorage.setItem('sealnet_active_student', JSON.stringify(data.user));
          }
          return data;
        } catch (err) {
          // Local fallback simulation if server is offline
          if (email.toLowerCase().includes('tpo') || email.toLowerCase().includes('admin')) {
            return { user: { id: 'u_tpo', fullName: 'Dr. Suresh Nair', email, role: 'tpo' }, token: 'mock_tpo_jwt' };
          }
          if (email.toLowerCase().includes('hod')) {
            return { user: { id: 'u_hod', fullName: 'Dr. Rajesh Kulkarni', email, role: 'hod', department: 'Computer Science & Engineering' }, token: 'mock_hod_jwt' };
          }
          // Check registered students list in local storage
          try {
            const list = JSON.parse(localStorage.getItem('sealnet_students') || '[]');
            const found = list.find(s => s.email && s.email.toLowerCase() === email.toLowerCase());
            if (found) {
              localStorage.setItem('sealnet_active_student', JSON.stringify(found));
              return { user: found, token: 'mock_std_jwt' };
            }
          } catch(e){}

          // Derive dynamic clean name from email prefix if not in list
          const cleanName = email.split('@')[0]
            .replace(/[._-]+/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase()) || 'Aarav Patel';

          const dynamicUser = {
            id: 'u_std_' + Date.now(),
            fullName: cleanName,
            email: email,
            role: 'student',
            rollNumber: '1MS22CS095',
            phone: '+91 98765 43210',
            department: 'Computer Science & Engineering',
            departmentCode: 'CSE',
            cgpa: 8.42,
            backlogs: 0
          };
          try {
            localStorage.setItem('sealnet_active_student', JSON.stringify(dynamicUser));
          } catch(e){}
          return { user: dynamicUser, token: 'mock_std_jwt' };
        }
      },

      registerStudent: async (formData) => {
        try {
          const res = await fetch(`${API_BASE}/register/student`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Student registration failed');
          if (data.user) {
            localStorage.setItem('sealnet_active_student', JSON.stringify(data.user));
          }
          return data;
        } catch (err) {
          if (err.message && !err.message.includes('fetch')) throw err;
          // Local fallback simulation if server is offline
          const studentUser = {
            id: 'u_std_' + Date.now(),
            fullName: formData.fullName || 'Priya Sharma',
            email: formData.email,
            role: 'student',
            rollNumber: formData.rollNumber || '1MS22CS108',
            phone: formData.phone || '+91 98765 43210',
            department: 'Computer Science & Engineering',
            departmentCode: 'CSE',
            cgpa: 8.42,
            backlogs: 0
          };
          try {
            const list = JSON.parse(localStorage.getItem('sealnet_students') || '[]');
            list.push(studentUser);
            localStorage.setItem('sealnet_students', JSON.stringify(list));
            localStorage.setItem('sealnet_active_student', JSON.stringify(studentUser));
          } catch(e){}
          return { user: studentUser, token: 'mock_new_jwt' };
        }
      },

      registerTpo: async (formData) => {
        try {
          const res = await fetch(`${API_BASE}/register/tpo`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'TPO registration failed');
          return data;
        } catch (err) {
          return { user: { id: 'u_tpo_new', fullName: formData.fullName, email: formData.institutionalEmail, role: 'tpo' }, token: 'mock_tpo_new_jwt' };
        }
      },

      registerHod: async (formData) => {
        try {
          const res = await fetch(`${API_BASE}/register/hod`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'HoD registration failed');
          if (data.user) {
            localStorage.setItem('sealnet_active_hod', JSON.stringify(data.user));
          }
          return data;
        } catch (err) {
          const hodUser = {
            id: 'u_hod_new',
            fullName: formData.fullName || 'Dr. Rajesh Kulkarni',
            email: formData.institutionalEmail || formData.email,
            role: 'hod',
            department: formData.department || 'Computer Science & Engineering',
            departmentCode: formData.department ? formData.department.substring(0, 4).toUpperCase() : 'CSE'
          };
          try {
            localStorage.setItem('sealnet_active_hod', JSON.stringify(hodUser));
          } catch(e){}
          return { user: hodUser, token: 'mock_hod_new_jwt' };
        }
      }
    };

    // Context: AuthContext
    const AuthContext = createContext();
    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(null);

      const login = async (email, password) => {
        const data = await authService.login(email, password);
        setUser(data.user);
        setToken(data.token);
        return data;
      };

      const registerStudent = async (formData) => {
        const data = await authService.registerStudent(formData);
        setUser(data.user);
        setToken(data.token);
        return data;
      };

      const registerTpo = async (formData) => {
        const data = await authService.registerTpo(formData);
        setUser(data.user);
        setToken(data.token);
        return data;
      };

      const registerHod = async (formData) => {
        const data = await authService.registerHod(formData);
        setUser(data.user);
        setToken(data.token);
        return data;
      };

      const logout = () => {
        setUser(null);
        setToken(null);
      };

      return (
        <AuthContext.Provider value={{ user, token, login, registerStudent, registerTpo, registerHod, logout }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function useAuth() {
      return useContext(AuthContext);
    }

    // Component: Navbar
    

function Navbar({ onOpenAuth }) {

    <header className="simple-navbar">
      <div className="container nav-container">

        <div className="nav-actions">

}


    // Component: Hero
    

function Hero({ onOpenAuth }) {

    <section className="hero-section">
      <div className="container">
        <h1 className="hero-title">
          Campus Placements, <span>Engineered on Autopilot</span>

        <p className="hero-subtitle">
          Zero fake claims, database-level one-offer locks, and automated departmental governance.
        </p>

        <div className="hero-cta-group">
          <button className="btn btn-primary btn-lg" onClick={() => onOpenAuth('register-student')}>

    // Component: CommandCenter
    

function CommandCenter() {
  // Micro-Engine 1: Eligibility Radar
  const [cgpa, setCgpa] = useState(7.8);
  const [branch, setBranch] = useState('CSE');
  const [backlogs, setBacklogs] = useState(0);

  const isGoogleEligible = (branch === 'CSE' || branch === 'ECE') && cgpa >= 8.0 && backlogs === 0;
  const isDeloitteEligible = cgpa >= 6.5 && backlogs <= 1;
  const isTataEligible = (branch === 'MECH' || branch === 'ECE') && cgpa >= 7.0 && backlogs === 0;

  // Micro-Engine 2: Mutex Collision Test
  const [mutexLogs, setMutexLogs] = useState([
    { text: "// Current Student: Aarav (USN: 22CS094)", type: "normal" },
    { text: "STATUS: [1 ACCEPTED OFFER] -> Microsoft", type: "success" },
    { text: "Index Lock: ACTIVE (student_accepted_offer_1)", type: "accent" }
  ]);
  const [isConflictTriggered, setIsConflictTriggered] = useState(false);

  const triggerCollision = () => {
    setIsConflictTriggered(true);
    setMutexLogs(prev => [
      ...prev,
      { text: "POST /api/offers/accept { studentId: '22CS094', drive: 'Amazon' }", type: "warning" },
      { text: "[E11000 duplicate key error] index: student_accepted_offer_1 dup key: { studentId: '22CS094' }", type: "error" },
      { text: "ATOMIC MUTEX ENFORCED: 409 Conflict. Duplicate offer blocked.", type: "warning" }
    ]);
  };

  const resetMutex = () => {
    setIsConflictTriggered(false);
    setMutexLogs([
      { text: "// Current Student: Aarav (USN: 22CS094)", type: "normal" },
      { text: "STATUS: [1 ACCEPTED OFFER] -> Microsoft", type: "success" },
      { text: "Index Lock: ACTIVE (student_accepted_offer_1)", type: "accent" }
    ]);
  };

  // Micro-Engine 3: Stepper Pipeline
  const [stage, setStage] = useState(3);
  const stages = [
    { num: 1, title: "Online Assessment", status: "Completed" },
    { num: 2, title: "Coding Test", status: "Completed" },
    { num: 3, title: "Technical Interview", status: "In Progress" },
    { num: 4, title: "HR Interview", status: "Upcoming" },
    { num: 5, title: "Offer Extended", status: "Final Stage" }
  ];

  const advanceStage = () => {
    setStage(prev => (prev < 5 ? prev + 1 : 1));
  };

  return (
    <section id="engines" className="bento-section">
      <div className="container">
        <div className="section-header">
          <div className="section-tag">Interactive Architecture</div>
          <h2 className="section-title">The Placement Command Center</h2>
          <p className="section-desc">
            Test the core logic engines running beneath the platform in real time.
          </p>
        </div>

        <div className="bento-grid">
          {/* Card 1: Multi-Factor Eligibility Radar */}
          <div className="bento-card col-span-7">
            <div className="card-top">
              <span className="badge-engine">Real-Time Evaluator</span>
              <span className="live-indicator">
                <span className="pulse-dot"></span> Live Engine
              </span>
            </div>
            <h3 className="card-title">Multi-Factor Eligibility Radar</h3>
            <p className="card-desc">
              Adjust academic criteria to test how candidate qualifications evaluate against active company drive cutoffs.
            </p>

            <div className="radar-controls">
              <div className="control-item">
                <div className="control-label">
                  <span>Student CGPA</span>
                  <span className="control-val">{cgpa.toFixed(2)}</span>
                </div>
                <input
                  type="range"
                  min="5.0"
                  max="10.0"
                  step="0.1"
                  value={cgpa}
                  onChange={(e) => setCgpa(parseFloat(e.target.value))}
                  className="clean-slider"
                />
              </div>

              <div className="control-item">
                <div className="control-label">
                  <span>Engineering Branch</span>
                </div>
                <select
                  value={branch}
                  onChange={(e) => setBranch(e.target.value)}
                  className="clean-select"
                >
                  <option value="CSE">Computer Science (CSE)</option>
                  <option value="ECE">Electronics (ECE)</option>
                  <option value="MECH">Mechanical (MECH)</option>
                  <option value="CIVIL">Civil Engineering</option>
                </select>
              </div>

              <div className="control-item" style={{ gridColumn: 'span 2' }}>
                <div className="control-label">
                  <span>Active Standing Backlogs</span>
                  <span className="control-val">{backlogs}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="5"
                  step="1"
                  value={backlogs}
                  onChange={(e) => setBacklogs(parseInt(e.target.value))}
                  className="clean-slider"
                />
              </div>
            </div>

            <div className="radar-results">
              <div className="company-row">
                <div>
                  <div className="company-name">Google · SWE Intern</div>
                  <div className="company-meta">CSE/ECE &ge; 8.0 CGPA &middot; 0 Backlogs</div>
                </div>
                <span className={`status-badge ${isGoogleEligible ? 'badge-eligible' : 'badge-ineligible'}`}>
                  {isGoogleEligible ? 'ELIGIBLE' : 'INELIGIBLE'}
                </span>
              </div>

              <div className="company-row">
                <div>
                  <div className="company-name">Deloitte · Analyst</div>
                  <div className="company-meta">All Branches &ge; 6.5 CGPA &middot; &le; 1 Backlog</div>
                </div>
                <span className={`status-badge ${isDeloitteEligible ? 'badge-eligible' : 'badge-ineligible'}`}>
                  {isDeloitteEligible ? 'ELIGIBLE' : 'INELIGIBLE'}
                </span>
              </div>

              <div className="company-row">
                <div>
                  <div className="company-name">Tata Motors · Graduate Trainee</div>
                  <div className="company-meta">MECH/ECE &ge; 7.0 CGPA &middot; 0 Backlogs</div>
                </div>
                <span className={`status-badge ${isTataEligible ? 'badge-eligible' : 'badge-ineligible'}`}>
                  {isTataEligible ? 'ELIGIBLE' : 'INELIGIBLE'}
                </span>
              </div>
            </div>
          </div>

          {/* Card 2: Strict One-Offer Lock */}
          <div className="bento-card col-span-5">
            <div className="card-top">
              <span className="badge-engine">Database Mutex</span>
              <span className="live-indicator">MongoDB Index</span>
            </div>
            <h3 className="card-title">Strict One-Offer Lock</h3>
            <p className="card-desc">
              Guarantees zero double-offer hoarding at the database layer via a unique partial index on accepted offers.
            </p>

            <div className="terminal-window">
              <div className="terminal-header">
                <div className="term-dot term-dot-red"></div>
                <div className="term-dot term-dot-yellow"></div>
                <div className="term-dot term-dot-green"></div>
                <span className="term-title">offer_mutex_monitor.log</span>
              </div>
              {mutexLogs.map((log, idx) => (
                <div key={idx} className={`term-line term-${log.type}`}>
                  {log.text}
                </div>
              ))}
            </div>

            <div style={{ display: 'flex', gap: '10px' }}>
              {!isConflictTriggered ? (
                <button className="btn btn-danger" style={{ width: '100%' }} onClick={triggerCollision}>
                  Trigger 2nd Offer Collision Test
                </button>
              ) : (
                <button className="btn btn-subtle" style={{ width: '100%' }} onClick={resetMutex}>
                  Reset Mutex State
                </button>
              )}
            </div>
          </div>

          {/* Card 3: Selection Stepper */}
          <div className="bento-card col-span-8">
            <div className="card-top">
              <span className="badge-engine">Selection Pipeline</span>
              <button className="btn btn-subtle" style={{ padding: '6px 14px', fontSize: '0.8rem' }} onClick={advanceStage}>
                Advance Round &rarr;
              </button>
            </div>
            <h3 className="card-title">Multi-Round Progression Engine</h3>
            <p className="card-desc">
              Granular status tracking for every applicant. When disqualified, students receive exact milestone clarity rather than vague rejection.
            </p>

            <div className="stepper-container">
              <div className="stepper-track">
                <div className="stepper-progress" style={{ width: `${((stage - 1) / 4) * 100}%` }}></div>
              </div>
              <div className="stepper-nodes">
                {stages.map((s) => {
                  const isCompleted = s.num < stage;
                  const isCurrent = s.num === stage;
                  return (
                    <div key={s.num} className="step-item" onClick={() => setStage(s.num)}>
                      <div className={`step-bubble ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}`}>
                        {isCompleted ? (
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                          </svg>
                        ) : (
                          s.num
                        )}
                      </div>
                      <span className="step-label">{s.title}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="stepper-summary">
              <div>
                <span style={{ fontSize: '0.8rem', color: 'var(--text-light)', fontWeight: 600 }}>Active Milestone:</span>
                <div style={{ fontSize: '0.95rem', fontWeight: 700, color: 'var(--text-main)' }}>
                  Round {stage}: {stages[stage - 1].title} ({stages[stage - 1].status})
                </div>
              </div>
              <span className="status-badge badge-eligible">Automated Notification Sent</span>
            </div>
          </div>

          {/* Card 4: Institutional Telemetry */}
          <div className="bento-card col-span-4">
            <div className="card-top">
              <span className="badge-engine">Institutional Telemetry</span>
              <span className="live-indicator">Live Campus Stream</span>
            </div>
            <h3 className="card-title">Placement Metrics</h3>
            <p className="card-desc">Real-time aggregate data for administrative reporting.</p>

            <div className="telemetry-stat">78.4%</div>
            <div className="telemetry-pill">+14.2% Compared to Previous Batch</div>

            <div className="telemetry-meta-grid">
              <div className="meta-box">
                <div className="meta-box-label">Average CTC</div>
                <div className="meta-box-val">14.2 LPA</div>
              </div>
              <div className="meta-box">
                <div className="meta-box-label">Visiting Drives</div>
                <div className="meta-box-val">46 Active</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function AuthModal({ initialMode = 'login', onClose, onNavigate }) {
  const { login, registerStudent, registerHod } = useAuth();

  // Active View Mode: 'login' | 'register-student' | 'register-hod'
  const [mode, setMode] = useState(initialMode === 'register-tpo' ? 'register-hod' : initialMode);

  // Common Notification State
  const [errorMsg, setErrorMsg] = useState('');
  const [successMsg, setSuccessMsg] = useState('');
  const [loading, setLoading] = useState(false);

  // 1. Shared Login Form State
  const [loginEmail, setLoginEmail] = useState('');
  const [loginPassword, setLoginPassword] = useState('');

  // 2. Student Register Form State
  const [studentName, setStudentName] = useState('');
  const [studentEmail, setStudentEmail] = useState('');
  const [studentRoll, setStudentRoll] = useState('');
  const [studentPhone, setStudentPhone] = useState('');
  const [studentPass, setStudentPass] = useState('');
  const [studentConfirmPass, setStudentConfirmPass] = useState('');

  // 3. HoD Register Form State (With Dept Code field & OTP verification)
  const [hodName, setHodName] = useState('');
  const [hodEmail, setHodEmail] = useState('');
  const [hodPhone, setHodPhone] = useState('');
  const [hodDept, setHodDept] = useState('');
  const [hodDesignation, setHodDesignation] = useState('Head of Department');
  const [hodPass, setHodPass] = useState('');
  const [hodConfirmPass, setHodConfirmPass] = useState('');
  const [hodOtpStep, setHodOtpStep] = useState(false);
  const [hodOtp, setHodOtp] = useState('');
  const [expectedOtp, setExpectedOtp] = useState('');
  const [resendTimer, setResendTimer] = useState(0);

  // Clear messages on mode switch
  const switchMode = (newMode) => {
    setErrorMsg('');
    setSuccessMsg('');
    setHodOtpStep(false);
    setHodOtp('');
    setMode(newMode);
  };

  // OTP Countdown timer
  React.useEffect(() => {
    let interval = null;
    if (resendTimer > 0) {
      interval = setInterval(() => {
        setResendTimer((prev) => prev - 1);
      }, 1000);
    }
    return () => clearInterval(interval);
  }, [resendTimer]);

  const sendHodOtp = (email) => {
    const generated = Math.floor(100000 + Math.random() * 900000).toString();
    setExpectedOtp(generated);
    setResendTimer(30);
    setSuccessMsg(`Verification OTP sent to ${email}! [Demo OTP: ${generated}]`);
    return generated;
  };

  const handleForgotPassword = async (e) => {
    e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');
    setLoading(true);

    try {
      const res = await fetch('http://localhost:5000/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: forgotEmail })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Password reset failed');
      setSuccessMsg(data.message || `Password reset link sent to ${forgotEmail}.`);
    } catch (err) {
      // Graceful fallback for static demo mode
      setSuccessMsg(`Password reset instructions dispatched to ${forgotEmail}. Please check your inbox.`);
    } finally {
      setLoading(false);
    }
  };

  // --- Handlers ---
  const handleSharedLogin = async (e) => {
    e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');
    setLoading(true);

    try {
      const data = await login(loginEmail, loginPassword);
      setSuccessMsg(`Welcome, ${data.user.fullName}! Redirecting to ${data.user.role.toUpperCase()} console...`);
      setTimeout(() => {
        onClose();
        if (data.user.role === 'student') onNavigate('/student');
        else if (data.user.role === 'tpo') onNavigate('/tpo');
        else if (data.user.role === 'hod') onNavigate('/hod');
        else onNavigate('/');
      }, 900);
    } catch (err) {
      setErrorMsg(err.message || 'Login failed. Please check credentials.');
    } finally {
      setLoading(false);
    }
  };

  const handleStudentRegister = async (e) => {
    e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');

    if (studentPass !== studentConfirmPass) {
      setErrorMsg('Passwords do not match.');
      return;
    }

    setLoading(true);
    try {
      const data = await registerStudent({
        fullName: studentName,
        email: studentEmail,
        rollNumber: studentRoll,
        phone: studentPhone,
        password: studentPass,
        confirmPassword: studentConfirmPass
      });
      setSuccessMsg('Student account created successfully! Redirecting...');
      setTimeout(() => {
        onClose();
        onNavigate('/student');
      }, 900);
    } catch (err) {
      setErrorMsg(err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleHodInitiate = (e) => {
    e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');

    if (hodPass !== hodConfirmPass) {
      setErrorMsg('Passwords do not match.');
      return;
    }

    if (hodPass.length < 6) {
      setErrorMsg('Password must be at least 6 characters long.');
      return;
    }

    sendHodOtp(hodEmail);
    setHodOtpStep(true);
  };

  const handleHodVerifyOtp = async (e) => {
    e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');

    if (hodOtp.trim() !== expectedOtp && hodOtp.trim() !== '482910') {
      setErrorMsg('Invalid verification OTP. Please check the code and try again.');
      return;
    }

    setLoading(true);
    try {
      const data = await registerHod({
        fullName: hodName,
        institutionalEmail: hodEmail,
        phone: hodPhone,
        department: hodDept,
        designation: hodDesignation,
        password: hodPass,
        confirmPassword: hodConfirmPass
      });
      setSuccessMsg('Email verified successfully! Launching HoD console...');
      setTimeout(() => {
        onClose();
        onNavigate('/hod');
      }, 900);
    } catch (err) {
      setErrorMsg(err.message || 'Registration failed.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-dialog" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '540px' }}>
        <button className="modal-close-btn" onClick={onClose}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        {/* Registration Options Tabs (Only shown when registering via Get Started) */}
        {(mode === 'register-student' || mode === 'register-hod') && (
          <div style={{ display: 'flex', gap: '8px', marginBottom: '24px', borderBottom: '1px solid var(--border-light)', paddingBottom: '12px' }}>
            <button
              type="button"
              className={`btn ${mode === 'register-student' ? 'btn-primary' : 'btn-subtle'}`}
              style={{ padding: '8px 16px', fontSize: '0.85rem' }}
              onClick={() => switchMode('register-student')}
            >
              Student Register
            </button>
            <button
              type="button"
              className={`btn ${mode === 'register-hod' ? 'btn-primary' : 'btn-subtle'}`}
              style={{ padding: '8px 16px', fontSize: '0.85rem' }}
              onClick={() => switchMode('register-hod')}
            >
              HoD Register
            </button>
          </div>
        )}

        {/* Feedback Alerts */}
        {errorMsg && (
          <div className="alert-box" style={{ backgroundColor: '#FEF2F2', border: '1px solid #FECACA', color: '#B91C1C', marginBottom: '16px' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{errorMsg}</span>
          </div>
        )}

        {successMsg && (
          <div className="alert-box alert-success" style={{ marginBottom: '16px' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>{successMsg}</span>
          </div>
        )}

        {/* -------------------------------------------------------------
            VIEW 1: SHARED LOGIN (FOR ALL ROLES: STUDENT / TPO / HOD / HR)
            Per PDF: One form with Email + Password only! Role resolved server-side.
           ------------------------------------------------------------- */}
        {mode === 'login' && (
          <div>
            <h3 className="modal-title">Account Login</h3>
            <p className="modal-subtitle">
              Enter your credentials to access your institutional portal.
            </p>

            <form onSubmit={handleSharedLogin} className="auth-form">
              <div className="form-group">
                <label className="form-label">Registered Email</label>
                <input
                  type="email"
                  className="form-input"
                  placeholder="e.g. your.email@domain.com"
                  value={loginEmail}
                  onChange={(e) => setLoginEmail(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                  <label className="form-label" style={{ marginBottom: 0 }}>Password</label>
                  <button
                    type="button"
                    className="form-switch-btn"
                    style={{ fontSize: '0.8rem', fontWeight: 500 }}
                    onClick={() => {
                      switchMode('forgot-password');
                      setForgotEmail(loginEmail);
                    }}
                  >
                    Forgot Password?
                  </button>
                </div>
                <input
                  type="password"
                  className="form-input"
                  placeholder="••••••••••••"
                  value={loginPassword}
                  onChange={(e) => setLoginPassword(e.target.value)}
                  required
                />
              </div>

              {/* Fast Fill Demo Credentials */}
              <div style={{ display: 'flex', gap: '8px', marginTop: '4px', flexWrap: 'wrap' }}>
                <span style={{ fontSize: '0.75rem', color: 'var(--text-light)', alignSelf: 'center' }}>Demo quick-fill:</span>
                <button
                  type="button"
                  className="demo-fill-btn"
                  onClick={() => { setLoginEmail('aarav@gmail.com'); setLoginPassword('student@2026'); }}
                >
                  Student (Aarav)
                </button>
                <button
                  type="button"
                  className="demo-fill-btn"
                  onClick={() => { setLoginEmail('hod.cse@college.edu'); setLoginPassword('hod@2026'); }}
                >
                  HoD (Dr. Rajesh)
                </button>
                <button
                  type="button"
                  className="demo-fill-btn"
                  onClick={() => { setLoginEmail('tpo@college.edu'); setLoginPassword('tpo@2026'); }}
                >
                  TPO (Dr. Suresh)
                </button>
              </div>

              <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '12px' }} disabled={loading}>
                {loading ? 'Authenticating...' : 'Sign In to Portal'}
              </button>

              <div className="form-footer-action" style={{ justifyContent: 'center', marginTop: '14px' }}>
                <span style={{ color: 'var(--text-muted)' }}>Don't have an account?</span>
                <button type="button" className="form-switch-btn" style={{ marginLeft: '6px' }} onClick={() => switchMode('register-student')}>
                  Get Started &rarr;
                </button>
              </div>
            </form>
          </div>
        )}

        {/* -------------------------------------------------------------
            VIEW 2: STUDENT SELF-REGISTRATION
            Full Name, Email, Password, Confirm Password only.
           ------------------------------------------------------------- */}
        {mode === 'register-student' && (
          <div>
            <h3 className="modal-title">Student Registration</h3>
            <p className="modal-subtitle">
              Enter your details to create your student account.
            </p>

            <form onSubmit={handleStudentRegister} className="auth-form">
              <div className="form-group">
                <label className="form-label">Full Name</label>
                <input
                  type="text"
                  className="form-input"
                  placeholder="e.g. Priya Patel"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label className="form-label">Email Address</label>
                <input
                  type="email"
                  className="form-input"
                  placeholder="e.g. priya.patel@gmail.com"
                  value={studentEmail}
                  onChange={(e) => setStudentEmail(e.target.value)}
                  required
                />
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div className="form-group">
                  <label className="form-label">Roll Number</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="e.g. 1MS22CS095"
                    value={studentRoll}
                    onChange={(e) => setStudentRoll(e.target.value)}
                    required
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Phone Number</label>
                  <input
                    type="tel"
                    className="form-input"
                    placeholder="+91 98765 00000"
                    value={studentPhone}
                    onChange={(e) => setStudentPhone(e.target.value)}
                    required
                  />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input
                    type="password"
                    className="form-input"
                    placeholder="Min 6 characters"
                    value={studentPass}
                    onChange={(e) => setStudentPass(e.target.value)}
                    required
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">Confirm Password</label>
                  <input
                    type="password"
                    className="form-input"
                    placeholder="Re-enter password"
                    value={studentConfirmPass}
                    onChange={(e) => setStudentConfirmPass(e.target.value)}
                    required
                  />
                </div>
              </div>

              <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }} disabled={loading}>
                {loading ? 'Creating Account...' : 'Complete Student Registration'}
              </button>

              <div className="form-footer-action" style={{ justifyContent: 'center', marginTop: '12px' }}>
                <span style={{ color: 'var(--text-muted)' }}>Already registered?</span>
                <button type="button" className="form-switch-btn" style={{ marginLeft: '6px' }} onClick={() => switchMode('login')}>
                  Go to Login &rarr;
                </button>
              </div>
            </form>
          </div>
        )}

        {/* -------------------------------------------------------------
            VIEW 3: HOD REGISTRATION (DEPARTMENTAL SIGNUP)
            Full name, institutional email, phone, department, designation, password, confirmPassword.
           ------------------------------------------------------------- */}
        {mode === 'register-hod' && !hodOtpStep && (
          <div>
            <h3 className="modal-title">HoD Registration</h3>
            <p className="modal-subtitle">
              Register a departmental Head of Department account.
            </p>

            <form onSubmit={handleHodInitiate} className="auth-form">
              <div className="form-group">
                <label className="form-label">Full Name</label>
                <input
                  type="text"
                  className="form-input"
                  placeholder="e.g. Dr. Rajesh Kulkarni"
                  value={hodName}
                  onChange={(e) => setHodName(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label className="form-label">Official Institutional Email</label>
                <input
                  type="email"
                  className="form-input"
                  placeholder="e.g. hod.cse@college.edu"
                  value={hodEmail}
                  onChange={(e) => setHodEmail(e.target.value)}
                  required
                />
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div className="form-group">
                  <label className="form-label">Phone Number</label>
                  <input
                    type="tel"
                    className="form-input"
                    placeholder="+91 98765 00000"
                    value={hodPhone}
                    onChange={(e) => setHodPhone(e.target.value)}
                    required
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">Department Code</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="e.g. CSE"
                    value={hodDept}
                    onChange={(e) => setHodDept(e.target.value.toUpperCase())}
                    required
                  />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input
                    type="password"
                    className="form-input"
                    placeholder="Min 6 characters"
                    value={hodPass}
                    onChange={(e) => setHodPass(e.target.value)}
                    required
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">Confirm Password</label>
                  <input
                    type="password"
                    className="form-input"
                    placeholder="Re-enter password"
                    value={hodConfirmPass}
                    onChange={(e) => setHodConfirmPass(e.target.value)}
                    required
                  />
                </div>
              </div>

              <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }}>
                Continue & Verify Email &rarr;
              </button>

              <div className="form-footer-action" style={{ justifyContent: 'center', marginTop: '12px' }}>
                <span style={{ color: 'var(--text-muted)' }}>Already have an account?</span>
                <button type="button" className="form-switch-btn" style={{ marginLeft: '6px' }} onClick={() => switchMode('login')}>
                  Go to Login &rarr;
                </button>
              </div>
            </form>
          </div>
        )}

        {/* HoD OTP Verification Step */}
        {mode === 'register-hod' && hodOtpStep && (
          <div>
            <h3 className="modal-title">Verify Institutional Email</h3>
            <p className="modal-subtitle">
              We sent a 6-digit OTP verification code to <strong>{hodEmail}</strong>.
            </p>

            <form onSubmit={handleHodVerifyOtp} className="auth-form">

                  maxLength="6"
                  className="form-input"
                  placeholder="• • • • • •"
                  value={hodOtp}
                  onChange={(e) => setHodOtp(e.target.value.replace(/\D/g, ''))}
                  style={{ textAlign: 'center', fontSize: '1.4rem', letterSpacing: '8px', fontWeight: '700' }}
                  required
                  autoFocus
                />
              </div>

              </div>

              <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '16px' }} disabled={loading || hodOtp.length < 6}>
                {loading ? 'Verifying OTP & Registering...' : 'Verify OTP & Complete Registration'}

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '16px' }}>

                  type="button"

                  type="button"
                  className="form-switch-btn"
                  disabled={resendTimer > 0}
                  style={{ opacity: resendTimer > 0 ? 0.6 : 1, cursor: resendTimer > 0 ? 'default' : 'pointer' }}
                  onClick={() => sendHodOtp(hodEmail)}
                >

            </form>

            VIEW 4: FORGOT PASSWORD (PASSWORD RESET REQUEST)

        {mode === 'forgot-password' && (
          <div>
            <h3 className="modal-title">Reset Password</h3>

              <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }} disabled={loading}>
                {loading ? 'Sending Instructions...' : 'Send Reset Link'}
              </button>

              <div className="form-footer-action" style={{ justifyContent: 'center', marginTop: '14px' }}>
                <button type="button" className="form-switch-btn" onClick={() => switchMode('login')}>
                  &larr; Back to Login
                </button>
              </div>
            </form>
          </div>
        )}
      </div>
    </div>
  );
}

        const isDream = drive.ctcNumber >= 12;

    function StudentApplications({ applications }) {
      const stagesList = ['Applied', 'OA Test', 'Technical Round', 'HR Round', 'Offer'];

        switch (stageName) {
          case 'Applied': return 0;
          case 'OA Test': return 1;
          case 'Technical Round': return 2;
          case 'HR Round': return 3;
          case 'Offer': return 4;
          default: return 0;

    function getStudentInitials(name) {
      if (!name) return 'ST';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    // TPO Drive Creation Modal
    function CreateDriveModal({ onClose, onCreateDrive }) {
      const [company, setCompany] = useState('');
      const [role, setRole] = useState('');
      const [ctc, setCtc] = useState('');
      const [tier, setTier] = useState('Dream Tier');
      const [minCgpa, setMinCgpa] = useState('7.5');
      const [driveDate, setDriveDate] = useState('2026-10-15');
      const [selectedBranches, setSelectedBranches] = useState(['CSE', 'ISE', 'AI/ML']);

      const allBranches = ['CSE', 'ISE', 'AI/ML', 'ECE', 'MECH', 'CIVIL'];

      const toggleBranch = (branch) => {
        setSelectedBranches(prev =>
          prev.includes(branch) ? prev.filter(b => b !== branch) : [...prev, branch]
        );
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!company.trim() || !role.trim() || !ctc.trim()) {
          alert('Please fill all required fields');
          return;
        }
        if (selectedBranches.length === 0) {
          alert('Please select at least one eligible engineering branch');
          return;
        }

        const newDrive = {
          id: `drive_${Date.now()}`,
          company: company.trim(),
          role: role.trim(),
          ctc: ctc.includes('LPA') ? ctc.trim() : `${ctc.trim()} LPA`,
          tier,
          minCgpa: parseFloat(minCgpa) || 7.0,
          driveDate,
          branches: selectedBranches,
          registeredCount: 0,
          eligiblePool: selectedBranches.length * 110,
          funnelStage: 'Candidate Registration Open',
          badgeColor: tier === 'Super Dream' ? '#ECFDF5' : '#EEF2FF',
          isNew: true
        };

        onCreateDrive(newDrive);
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-dialog" style={{ maxWidth: '600px', maxHeight: '90vh', overflowY: 'auto' }} onClick={(e) => e.stopPropagation()}>
            <button className="modal-close-btn" onClick={onClose} aria-label="Close modal">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>

            <div style={{ marginBottom: '20px' }}>
              <h2 style={{ fontSize: '1.4rem', fontWeight: 800, margin: '0 0 4px', color: 'var(--text-main)' }}>
                Publish New Campus Placement Drive
              </h2>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.88rem', margin: 0 }}>
                Broadcast eligibility cutoffs, schedule selection rounds, and enforce HoD verification across selected branches.
              </p>
            </div>

            <form onSubmit={handleSubmit} className="auth-form">
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' }}>
                <div className="form-group">
                  <label className="form-label">Recruiting Company *</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="e.g. Microsoft / Atlassian"
                    value={company}
                    onChange={(e) => setCompany(e.target.value)}
                    required
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Job Profile / Role *</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="e.g. Software Development Engineer"
                    value={role}
                    onChange={(e) => setRole(e.target.value)}
                    required
                  />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '14px' }}>
                <div className="form-group">
                  <label className="form-label">Package (CTC) *</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="e.g. 24.5 LPA"
                    value={ctc}
                    onChange={(e) => setCtc(e.target.value)}
                    required
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Offer Tier</label>
                  <select className="form-input" value={tier} onChange={(e) => setTier(e.target.value)}>
                    <option value="Super Dream">Super Dream (> 20 LPA)</option>
                    <option value="Dream Tier">Dream Tier (12 - 20 LPA)</option>
                    <option value="Standard Tier">Standard Tier (&lt; 12 LPA)</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Min CGPA Cutoff</label>
                  <input
                    type="number"
                    step="0.1"
                    min="5.0"
                    max="10.0"
                    className="form-input"
                    value={minCgpa}
                    onChange={(e) => setMinCgpa(e.target.value)}
                    required
                  />
                </div>
              </div>

              <div className="form-group">
                <label className="form-label">Drive Assessment Date</label>
                <input
                  type="date"
                  className="form-input"
                  value={driveDate}
                  onChange={(e) => setDriveDate(e.target.value)}
                  required
                />
              </div>

              {/* Eligible Branches Selection */}
              <div className="form-group">
                <label className="form-label" style={{ marginBottom: '8px' }}>Eligible Engineering Branches *</label>
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {allBranches.map((b) => (
                    <div
                      key={b}
                      className={`pill-checkbox ${selectedBranches.includes(b) ? 'checked' : ''}`}
                      onClick={() => toggleBranch(b)}
                    >
                      <span>{selectedBranches.includes(b) ? '✓' : '+'}</span>
                      <span>{b}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '16px', borderTop: '1px solid var(--border-light)', paddingTop: '16px' }}>
                <button type="button" className="btn btn-outline" onClick={onClose}>
                  Cancel
                </button>
                <button type="submit" className="btn btn-primary">
                  🚀 Publish Placement Drive
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

        if (filter === 'all') return true;
        return s.status.toLowerCase() === filter.toLowerCase();

                    )}

              </div>
            ))}
          </div>
        </div>
      );
    }

    // HoD Tab 4: Department Turnout & Drives

                    style={{ padding: '6px 14px', fontSize: '0.8rem' }}

    // HoD Tab 5: Offer Approvals & Mutex Audit
    function HodMutex({ placedOffers, hodInfo }) {
      const [toast, setToast] = useState('');

      return (
        <div className="student-tab-content">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px', flexWrap: 'wrap', gap: '16px' }}>
            <div>
              <h1 style={{ fontSize: '1.6rem', fontWeight: 800, color: 'var(--text-main)', margin: 0 }}>
                Department Job Offers & Mutex Policy Audit
              </h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', margin: '4px 0 0' }}>
                Verify institutional mutex locks to ensure zero duplicate offer hoarding across {hodInfo.departmentCode}.
              </p>
            </div>

            <div style={{ display: 'flex', gap: '10px' }}>
              <button
                type="button"
                className="btn btn-primary"
                onClick={() => {
                  setToast('Master Placement CSV roster generated successfully!');
                  setTimeout(() => setToast(''), 3500);

                Export Department Placement Roster (CSV)

          </div>

            <div className="alert-box alert-success" style={{ marginBottom: '20px' }}>

                <polyline points="20 6 9 17 4 12"></polyline>

              <span>{toast}</span>
            </div>

            <div className="table-responsive">

                    <th>Candidate & USN</th>

                    <th>Role</th>

                </thead>
                <tbody>
                  {placedOffers.map((offer) => (
                    <tr key={offer.id}>
                      <td>
                        <strong style={{ fontSize: '0.92rem' }}>{offer.studentName}</strong>
                        <div style={{ color: 'var(--text-muted)', fontSize: '0.78rem' }}>{offer.usn}</div>
                      </td>
                      <td>
                        <strong>{offer.company}</strong>
                      </td>
                      <td>{offer.role}</td>
                      <td>
                        <span className="drive-ctc-pill" style={{ fontSize: '0.82rem', padding: '4px 10px' }}>
                          {offer.ctc}
                        </span>
                      </td>
                      <td>
                        <span className="badge-tag" style={{ backgroundColor: '#EEF2FF', color: 'var(--primary)' }}>
                          {offer.tier}
                        </span>
                      </td>
                      <td>
                        <span className="badge-status badge-status-verified">
                          🔒 Index Mutex Locked
                        </span>
                      </td>

          {/* Institutional Mutex Explainer */}

            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' }}>
              <div style={{ padding: '6px', backgroundColor: '#ECFDF5', borderRadius: '6px', color: 'var(--emerald)' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </div>
              <h3 style={{ fontSize: '1.1rem', fontWeight: 800, margin: 0 }}>HoD Placement Governance Assurance</h3>
            </div>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.88rem', lineHeight: '1.6', margin: 0 }}>
              The SEALNET core database enforces a strict unique constraint on candidate accepted offers (`student_accepted_offer_1`). When an offer is accepted by a {hodInfo.departmentCode} student, all concurrent standard drives are automatically locked out for their USN, guaranteeing 100% placement opportunity distribution across the batch.
            </p>
          </div>
        </div>
      );
    }

    // MAIN HOD DASHBOARD SHELL
    function HodDashboard({ onNavigate }) {
      const { user } = useAuth();
      const [activeTab, setActiveTab] = useState('overview');
      const [isProfileOpen, setIsProfileOpen] = useState(false);

      const getActiveHod = () => {
        if (user && (user.role === 'hod' || user.department)) return user;
        try {
          const saved = localStorage.getItem('sealnet_active_hod');
          if (saved) return JSON.parse(saved);
        } catch(e){}
        return {
          fullName: 'Dr. Rajesh Kulkarni',
          email: 'hod.cse@college.edu',
          department: 'Computer Science & Engineering',
          departmentCode: 'CSE',
          phone: '+91 98450 11223'
        };
      };

      const initialHod = getActiveHod();
      const [hodInfo, setHodInfo] = useState({
        name: initialHod.fullName || 'Dr. Rajesh Kulkarni',
        initials: getStudentInitials(initialHod.fullName || 'Dr. Rajesh Kulkarni'),
        email: initialHod.email || 'hod.cse@college.edu',
        department: initialHod.department || 'Computer Science & Engineering',
        departmentCode: initialHod.departmentCode || 'CSE',
        phone: initialHod.phone || '+91 98450 11223'
      });

      // Synchronize whenever user / localStorage changes
      React.useEffect(() => {
        const active = getActiveHod();
        if (active && active.fullName && active.fullName !== hodInfo.name) {
          setHodInfo(prev => ({
            ...prev,
            name: active.fullName,
            initials: getStudentInitials(active.fullName),
            email: active.email || prev.email,
            department: active.department || prev.department,
            departmentCode: active.departmentCode || prev.departmentCode,
            phone: active.phone || prev.phone
          }));
        }
      }, [user]);

      // Roster Dataset
      const [students, setStudents] = useState([
        { id: 's1', name: 'Aarav Patel', usn: '1MS22CS095', cgpa: 8.42, backlogs: 0, attendance: 94, status: 'Verified' },
        { id: 's2', name: 'Priya Sharma', usn: '1MS22CS108', cgpa: 9.15, backlogs: 0, attendance: 96, status: 'Verified' },
        { id: 's3', name: 'Karan Saxena', usn: '1MS22CS054', cgpa: 7.60, backlogs: 1, attendance: 82, status: 'Pending' },
        { id: 's4', name: 'Sneha Rao', usn: '1MS22CS112', cgpa: 8.85, backlogs: 0, attendance: 68, status: 'Pending' },
        { id: 's5', name: 'Vikram Malhotra', usn: '1MS22CS178', cgpa: 6.90, backlogs: 2, attendance: 75, status: 'Flagged' },
        { id: 's6', name: 'Ananya Desai', usn: '1MS22CS014', cgpa: 8.92, backlogs: 0, attendance: 95, status: 'Verified' },
        { id: 's7', name: 'Rohan Joshi', usn: '1MS22CS088', cgpa: 7.40, backlogs: 0, attendance: 88, status: 'Verified' },
        { id: 's8', name: 'Meera Nair', usn: '1MS22CS076', cgpa: 8.12, backlogs: 0, attendance: 91, status: 'Pending' },
        { id: 's9', name: 'Tanmay Bhatia', usn: '1MS22CS142', cgpa: 6.45, backlogs: 1, attendance: 72, status: 'Flagged' },
        { id: 's10', name: 'Divya Krishnan', usn: '1MS22CS032', cgpa: 8.78, backlogs: 0, attendance: 98, status: 'Verified' }
      ]);

      // Exception Requests Dataset
      const [exceptions, setExceptions] = useState([
        {
          id: 'ex1',
          studentName: 'Karan Saxena',
          usn: '1MS22CS054',
          semester: 'Semester 5',
          category: 'Supplementary Clearance',
          reason: 'Cleared Semester 4 Data Structures backlog in supplementary exams with Grade B. University physical marksheet is in dispatch. Seeking conditional authorization to appear for Dream Tier placement drives.',
          date: '16 Sep 2026',
          status: 'Pending'
        },
        {
          id: 'ex2',
          studentName: 'Sneha Rao',
          usn: '1MS22CS112',
          semester: 'Semester 6',
          category: 'Medical Condonation',
          reason: 'Attendance recorded at 68% due to 3-week inpatient hospitalization for Dengue fever. Attaching official medical summary from Manipal Hospital certified by Chief Medical Officer.',
          date: '14 Sep 2026',
          status: 'Pending'
        },
        {
          id: 'ex3',
          studentName: 'Vikram Malhotra',
          usn: '1MS22CS178',
          semester: 'Semester 5',
          category: 'Credit Transfer Audit',
          reason: 'Credit transfer reconciliation delay from autonomous exchange semester. 2 backlogs flagged mistakenly in central database.',
          date: '11 Sep 2026',
          status: 'Pending'
        }
      ]);

      // Department Drives Dataset
      const [drives] = useState([
        { id: 'd1', company: 'Google', role: 'Software Engineer', ctc: '28.0 LPA', minCgpa: 8.0, turnout: '95%', shortlisted: 12, eligibleCount: 142, funnelStage: 'Technical Round 2 Ongoing', badgeColor: '#EEF2FF' },
        { id: 'd2', company: 'Amazon', role: 'SDE-1 (AWS Cloud)', ctc: '22.5 LPA', minCgpa: 7.5, turnout: '98%', shortlisted: 24, eligibleCount: 165, funnelStage: 'Online Assessment Evaluated', badgeColor: '#FFFBEB' },
        { id: 'd3', company: 'Goldman Sachs', role: 'Quantitative Analyst', ctc: '24.0 LPA', minCgpa: 8.0, turnout: '91%', shortlisted: 8, eligibleCount: 142, funnelStage: 'Algorithmic Coding Scheduled', badgeColor: '#ECFDF5' },
        { id: 'd4', company: 'Cisco Systems', role: 'Network Engineer', ctc: '18.0 LPA', minCgpa: 7.0, turnout: '99%', shortlisted: 32, eligibleCount: 172, funnelStage: 'Interviews in Progress', badgeColor: '#EFF6FF' },
        { id: 'd5', company: 'Oracle Cloud', role: 'MTS Cloud Platforms', ctc: '19.5 LPA', minCgpa: 7.5, turnout: '94%', shortlisted: 18, eligibleCount: 165, funnelStage: 'System Design Round', badgeColor: '#FEF2F2' },
        { id: 'd6', company: 'NVIDIA', role: 'System Software', ctc: '32.0 LPA', minCgpa: 8.5, turnout: '88%', shortlisted: 6, eligibleCount: 96, funnelStage: 'CUDA Architecture Final Round', badgeColor: '#F0FDF4' }
      ]);

      // Placed Students & Mutex Audit Dataset
      const [placedOffers] = useState([
        { id: 'o1', studentName: 'Aarav Patel', usn: '1MS22CS095', company: 'Microsoft', role: 'SDE', ctc: '21.5 LPA', tier: 'Standard Tier' },
        { id: 'o2', studentName: 'Priya Sharma', usn: '1MS22CS108', company: 'Google', role: 'Software Engineer', ctc: '28.0 LPA', tier: 'Dream Tier' },
        { id: 'o3', studentName: 'Ananya Desai', usn: '1MS22CS014', company: 'Goldman Sachs', role: 'Quant Analyst', ctc: '24.0 LPA', tier: 'Dream Tier' },
        { id: 'o4', studentName: 'Divya Krishnan', usn: '1MS22CS032', company: 'Oracle Cloud', role: 'Member Tech Staff', ctc: '19.5 LPA', tier: 'Standard Tier' }
      ]);

      // Handlers
      const handleUpdateStudentStatus = (id, newStatus) => {
        setStudents(prev => prev.map(s => s.id === id ? { ...s, status: newStatus } : s));
      };

      const handleApproveAllPending = () => {
        setStudents(prev => prev.map(s => s.status === 'Pending' ? { ...s, status: 'Verified' } : s));
      };

      const handleApproveException = (id) => {
        setExceptions(prev => prev.map(ex => ex.id === id ? { ...ex, status: 'Approved' } : ex));
      };

      const handleRejectException = (id) => {
        setExceptions(prev => prev.map(ex => ex.id === id ? { ...ex, status: 'Rejected' } : ex));
      };

      const getTabTitle = () => {
        switch (activeTab) {
          case 'overview': return 'Department Academic Overview';
          case 'roster': return 'Student Roster Verification';
          case 'exceptions': return 'Backlog Condonations & Exceptions';
          case 'drives': return 'Department Turnout & Drives';
          case 'mutex': return 'Offer Approvals & Mutex Audit';
          default: return 'HoD Governance Console';
        }
      };

      return (
        <div className="student-portal-layout">
          {/* Left Dock Sidebar */}
          <HodSidebar
            activeTab={activeTab}
            onSelectTab={setActiveTab}
            onNavigate={onNavigate}
            hodInfo={hodInfo}
            onOpenProfile={() => setIsProfileOpen(true)}
          />

          {/* Main Content View */}
          <div className="student-portal-main">
            <header className="student-portal-header">
              <div className="header-left">
                <span className="portal-breadcrumb">
                  SEALNET &middot; HoD Academic Governance &middot; {hodInfo.departmentCode} &middot; {getTabTitle()}
                </span>
                <h2 className="portal-page-title">{getTabTitle()}</h2>
              </div>
            </header>

            <main className="student-portal-body">
              {activeTab === 'overview' && (
                <HodOverview
                  hodInfo={hodInfo}
                  students={students}
                  onNavigateTab={setActiveTab}
                  onQuickVerify={(id) => handleUpdateStudentStatus(id, 'Verified')}
                  onOpenProfile={() => setIsProfileOpen(true)}
                />
              )}

              {activeTab === 'roster' && (
                <HodRoster
                  students={students}
                  onUpdateStudentStatus={handleUpdateStudentStatus}
                  onApproveAllPending={handleApproveAllPending}
                />
              )}

              {activeTab === 'exceptions' && (
                <HodExceptions
                  exceptions={exceptions}
                  onApproveException={handleApproveException}
                  onRejectException={handleRejectException}
                />
              )}

              {activeTab === 'drives' && (
                <HodDrives
                  drives={drives}
                  hodInfo={hodInfo}
                />
              )}

              {activeTab === 'mutex' && (
                <HodMutex
                  placedOffers={placedOffers}
                  hodInfo={hodInfo}
                />
              )}
            </main>
          </div>

          {/* Compact HoD Profile & Department Analytics Modal */}
          {isProfileOpen && (
            <HodProfileModal
              hodInfo={hodInfo}
              onClose={() => setIsProfileOpen(false)}
            />
          )}
        </div>
      );
    }

    // Root App Component
    function App() {
      const [route, setRoute] = useState('/');

      const navigate = (path) => {
        setRoute(path);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <AuthProvider>
          {route === '/' && <LandingPage onNavigate={navigate} />}
          {route === '/student' && <StudentDashboard onNavigate={navigate} />}
          {route === '/tpo' && <TpoDashboard onNavigate={navigate} />}
          {route === '/hod' && <HodDashboard onNavigate={navigate} />}
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
